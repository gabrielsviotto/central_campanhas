<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  --ink-soft:#1B1E6E;
  --paper:#F3F8F6;
  --paper-line:#DCE9E4;
  --paper-dim:#E3EFEA;

  --pend-accent:#818CF8;
  --pend-text:#040491;
  --pend-bg:#E4E4F7;
  --pago-text:#087C4C;

  --text-dark:#1E2333;

.pill.pago{background:var(--pago-bg); color:var(--pago-text);}

.detail-row td{

}
.detail-inner{padding:6px 14px 14px 34px;}
.detail-inner table{font-size:13px;}
.detail-inner thead th{border-bottom:1px solid var(--paper-dim); font-size:10px;}
.detail-inner tbody tr{cursor:default; border-bottom:1px solid var(--paper-line);}
.detail-inner tbody tr:hover{background:transparent;}

.empty{
  text-align:center;
  padding:40px 20px;
  color:var(--text-mute);
}
.empty b{color:var(--text-dark);}

.multi-filter{

}
.multi-filter summary{

.sheet-tabs{

.sheet-tab{

  border-bottom:2px solid transparent;

.sheet-tab:hover{color:var(--text-dark);}
.sheet-tab.active{

  font-weight:600;

.loading{

<body>
<div id="root" class="app"><div class="loading">Carregando…</div></div>

<script>
// ---------------------------------------------------------------------------
// Configuração do Supabase. Preencha com os dados do seu projeto
// (Project Settings -> API). A "anon key" é pública por natureza — a
// segurança dos dados vem das políticas de Row Level Security (RLS) do banco
// e da exigência de login, não do sigilo dessa chave.
// ---------------------------------------------------------------------------
const SUPABASE_URL = "https://mptpyvgigepvsmylnnqu.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_1C1sYenitnZhUausK5lQPw_-lQ4ysAp";
const CAMPANHAS_TABLE = "campanhas";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let realtimeChannel = null;

let state = {
  session: null,
  authReady: false,
  loginEmail: "",
  loginPassword: "",
  loginError: null,
  loginBusy: false,

  loading: true,
  error: null,
  records: {},     // map key -> record, alimentado pelo Supabase
  search: "",
  expanded: null,
  // filtros aplicados (usados pelo aggregate()) e filtros em edição (ainda não
  // aplicados, controlados pelas caixas de marcar até clicar em "Aplicar").
  // Campanha fica de fora: continua no formato antigo de abas (seleção única).
  filters: { status: [], mes: [], filial: [], regional: [], cargo: [] },
  pendingFilters: { status: [], mes: [], filial: [], regional: [], cargo: [] },
  campanhaFilter: "todos",
  sortColumn: null,
  sortDir: "asc",
  lastSystemRefresh: null,

  passwordFormOpen: false,
  newPassword: "",
  newPassword2: "",
  passwordMsg: null,
  passwordBusy: false,
};

function normText(s){
  return String(s||"")
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .toLowerCase().trim().replace(/\s+/g," ");
}

function naturalCompare(a, b){
  return String(a||"").localeCompare(String(b||""), undefined, {numeric:true, sensitivity:"base"});
}

function normalizeStatus(v){
  const s = normText(v);
  if(s.startsWith("pago")) return "Pago";
  if(s.startsWith("pend")) return "Pendente";
  return String(v||"").trim() || "Pendente";
}

function recordKey(r){
  return r.cpf + "__" + normText(r.campanha) + "__" + normText(r.mes);
}

// ---------------------------------------------------------------------------
// Autenticação (Supabase Auth). Os usuários precisam ser criados manualmente
// no painel do Supabase (Authentication -> Users -> Invite user) — o
// autocadastro fica desativado.
// ---------------------------------------------------------------------------
async function initAuth(){
  const { data } = await sb.auth.getSession();
  state.session = data.session;
  state.authReady = true;
  sb.auth.onAuthStateChange((_event, session) => {
    state.session = session;
    if(session){
      loadData();
      subscribeRealtime();
    } else {
      unsubscribeRealtime();
      state.records = {};
      render();
    }
  });
  if(state.session){
    loadData();
    subscribeRealtime();
  } else {
    render();
  }
}

async function handleLogin(){
  if(!state.loginEmail || !state.loginPassword){
    state.loginError = "Informe e-mail e senha.";
    render();
    return;
  }
  state.loginBusy = true;
  state.loginError = null;
  render();
  const { data, error } = await sb.auth.signInWithPassword({
    email: state.loginEmail,
    password: state.loginPassword,
  });
  state.loginBusy = false;
  if(error){
    state.loginError = "Não foi possível entrar: " + error.message;
    render();
    return;
  }
  state.session = data.session;
  state.loginPassword = "";
  loadData();
  subscribeRealtime();
}

async function handleLogout(){
  unsubscribeRealtime();
  try{
    await sb.auth.signOut();
  }catch(e){
    // segue o logout localmente mesmo se a chamada de rede falhar
  }
  state.session = null;
  state.records = {};
  render();
}

async function handleSetPassword(){
  if(!state.newPassword || state.newPassword.length < 6){
    state.passwordMsg = { type: "error", text: "A senha precisa ter pelo menos 6 caracteres." };
    render();
    return;
  }
  if(state.newPassword !== state.newPassword2){
    state.passwordMsg = { type: "error", text: "As senhas não são iguais." };
    render();
    return;
  }
  state.passwordBusy = true;
  state.passwordMsg = null;
  render();
  const { error } = await sb.auth.updateUser({ password: state.newPassword });
  state.passwordBusy = false;
  if(error){
    state.passwordMsg = { type: "error", text: "Não foi possível salvar: " + error.message };
    render();
    return;
  }
  state.newPassword = "";
  state.newPassword2 = "";
  state.passwordMsg = { type: "success", text: "Senha definida! Use-a no próximo login." };
  render();
}

// ---------------------------------------------------------------------------
// Dados: lidos direto da tabela "campanhas" no Supabase. Este app é somente
// leitura — quem alimenta a tabela é outro processo/pessoa. A lista some/
// aparece sozinha porque o Realtime avisa este app sobre qualquer mudança.
// ---------------------------------------------------------------------------
async function fetchRecords(){
  const { data, error } = await sb.from(CAMPANHAS_TABLE).select("*");
  if(error) throw error;
  const records = {};
  (data || []).forEach(row => {
    const cpf = String(row.cpf || "").trim();
    if(!cpf) return;
    const record = {
      cpf,
      nome: row.nome || "",
      cargo: row.cargo || "",
      filial: row.filial || "",
      regional: row.regional || "",
      re: row.re || "",
      statusFilial: row.status_filial || "",
      statusColaborador: row.status_colaborador || "",
      campanha: row.campanha || "",
      mes: row.mes || "",
      premiacao: Number(row.premiacao) || 0,
      statusPremiacao: normalizeStatus(row.status_premiacao),
      atualizadoEm: row.atualizado_em ? new Date(row.atualizado_em).getTime() : Date.now(),
    };
    records[recordKey(record)] = record;
  });
  return records;
}

async function loadData(){
  try{
    state.records = await fetchRecords();
    state.error = null;
    state.lastSystemRefresh = Date.now();
  }catch(e){
    state.error = "Erro ao carregar dados do Supabase: " + e.message;
  }
  state.loading = false;
  render();
}

async function refreshRecordsSilently(){
  try{
    state.records = await fetchRecords();
    state.error = null;
    state.lastSystemRefresh = Date.now();
  }catch(e){
    state.error = "Erro ao atualizar dados: " + e.message;
  }
  render();
}

function subscribeRealtime(){
  if(realtimeChannel) return;
  realtimeChannel = sb.channel("campanhas-changes")
    .on("postgres_changes", { event: "*", schema: "public", table: CAMPANHAS_TABLE }, () => {
      refreshRecordsSilently();
    })
    .subscribe();
}

function unsubscribeRealtime(){
  if(realtimeChannel){
    sb.removeChannel(realtimeChannel);
    realtimeChannel = null;
  }
}

function mesSortKey(mes){
  const m = String(mes||"").trim().match(/^(\d{1,2})\/(\d{4})$/);
  if(m) return parseInt(m[2],10)*100 + parseInt(m[1],10);
  return null;
}

function distinctMonths(){
  const set = new Set();
  Object.values(state.records).forEach(r => { if(r.mes) set.add(r.mes); });
  const arr = Array.from(set);
  arr.sort((a,b) => {
    const ka = mesSortKey(a), kb = mesSortKey(b);
    if(ka != null && kb != null) return ka - kb;
    if(ka != null) return -1;
    if(kb != null) return 1;
    return naturalCompare(a, b);
  });
  return arr;
}

function distinctCampanhas(){
  const set = new Set();
  Object.values(state.records).forEach(r => { if(r.campanha) set.add(r.campanha); });
  return Array.from(set).sort(naturalCompare);
}

function distinctFiliais(){
  const set = new Set();
  Object.values(state.records).forEach(r => { if(r.filial) set.add(r.filial); });
  return Array.from(set).sort(naturalCompare);
}

function distinctRegionais(){
  const set = new Set();
  Object.values(state.records).forEach(r => { if(r.regional) set.add(r.regional); });
  return Array.from(set).sort(naturalCompare);
}

function distinctCargos(){
  const set = new Set();
  Object.values(state.records).forEach(r => { if(r.cargo) set.add(r.cargo); });
  return Array.from(set).sort(naturalCompare);
}

function lastDbUpdate(){
  let max = 0;
  Object.values(state.records).forEach(r => { if(r.atualizadoEm > max) max = r.atualizadoEm; });
  return max || null;
}

function fmtDateTime(ms){
  if(!ms) return "—";
  return new Date(ms).toLocaleString("pt-BR", {day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit", second:"2-digit"});
}

const SORT_ACCESSORS = {
  filial: e => e.filial || "",
  regional: e => e.regional || "",
  re: e => e.re || "",
  nome: e => e.nome || "",
  cargo: e => e.cargo || "",
  cpf: e => e.cpf || "",
  totalPendente: e => e.totalPendente,
  totalPago: e => e.totalPago,
  qtdPendente: e => e.qtdPendente,
};

function sortList(list){
  const col = state.sortColumn;
  if(!col || !SORT_ACCESSORS[col]){
    list.sort((a,b) => b.totalPendente - a.totalPendente || naturalCompare(a.nome, b.nome));
    return list;
  }
  const acc = SORT_ACCESSORS[col];
  const dir = state.sortDir === "desc" ? -1 : 1;
  list.sort((a,b) => {
    const va = acc(a), vb = acc(b);
    const cmp = (typeof va === "number" && typeof vb === "number") ? (va - vb) : naturalCompare(va, vb);
    return cmp * dir;
  });
  return list;
}

function aggregate(){
  const byCpf = {};
  const f = state.filters;
  let baseRecords = Object.values(state.records);
  if(f.mes.length > 0){
    baseRecords = baseRecords.filter(r => f.mes.includes(r.mes));
  }
  if(state.campanhaFilter !== "todos"){
    baseRecords = baseRecords.filter(r => r.campanha === state.campanhaFilter);
  }
  if(f.filial.length > 0){
    baseRecords = baseRecords.filter(r => f.filial.includes(r.filial));
  }
  if(f.regional.length > 0){
    baseRecords = baseRecords.filter(r => f.regional.includes(r.regional));
  }
  if(f.cargo.length > 0){
    baseRecords = baseRecords.filter(r => f.cargo.includes(r.cargo));
  }
  baseRecords.forEach(r => {
    if(!byCpf[r.cpf]){
      byCpf[r.cpf] = {
        cpf: r.cpf, nome: r.nome, cargo: r.cargo, filial: r.filial, regional: r.regional, re: r.re,
        totalPendente:0, totalPago:0, qtdPendente:0, qtdPago:0,
        campanhas: [], _latest: 0,
      };
    }
    const e = byCpf[r.cpf];
    if(r.atualizadoEm >= e._latest){
      e._latest = r.atualizadoEm;
      e.nome = r.nome || e.nome;
      e.cargo = r.cargo || e.cargo;
      e.filial = r.filial || e.filial;
      e.regional = r.regional || e.regional;
      e.re = r.re || e.re;
    }
    e.campanhas.push({campanha: r.campanha, mes: r.mes, premiacao: r.premiacao, status: r.statusPremiacao});
    if(r.statusPremiacao === "Pendente"){ e.totalPendente += r.premiacao; e.qtdPendente++; }
    else if(r.statusPremiacao === "Pago"){ e.totalPago += r.premiacao; e.qtdPago++; }
  });
  let list = Object.values(byCpf);

  if(state.search.trim()){
    const q = normText(state.search);
    const qDigits = q.replace(/\D/g,"");
    list = list.filter(e =>
      normText(e.nome).includes(q) ||
      (qDigits && e.cpf.includes(qDigits)) ||
      (qDigits && normText(e.re).includes(qDigits)) ||
      normText(e.re).includes(q)
    );
  }
  if(f.status.length === 1){
    if(f.status[0] === "pendente") list = list.filter(e => e.qtdPendente > 0);
    else if(f.status[0] === "sem_pendencia") list = list.filter(e => e.qtdPendente === 0);
  }

  sortList(list);
  return list;
}

function thSort(label, col, extraClass){
  const active = state.sortColumn === col;
  const arrow = active ? (state.sortDir === "asc" ? " ▲" : " ▼") : "";
  return '<th class="sortable'+(extraClass?' '+extraClass:'')+(active?' active':'')+'" data-sort="'+col+'">'+label+arrow+'</th>';
}

function renderMultiFilter(key, label, options){
  // options: array de {value, label} OU array de strings (nesse caso value===label)
  const opts = options.map(o => (typeof o === "string") ? {value:o, label:o} : o);
  const selected = state.pendingFilters[key];
  const countLabel = selected.length > 0 ? label + " (" + selected.length + ")" : label;
  let html = '<details class="multi-filter" name="filtro-grupo" data-filter-key="'+key+'" data-label="'+label+'">';
  html += '<summary>'+countLabel+'</summary>';
  html += '<div class="multi-filter-options">';
  if(opts.length === 0){
    html += '<div class="multi-filter-empty">Nenhuma opção disponível</div>';
  }
  opts.forEach(opt => {
    const safeVal = String(opt.value).replace(/"/g,"&quot;");
    const checked = selected.includes(opt.value) ? " checked" : "";
    html += '<label><input type="checkbox" data-filter-key="'+key+'" value="'+safeVal+'"'+checked+'> '+opt.label+'</label>';
  });
  html += '</div></details>';
  return html;
}

function applyFilters(){
  state.filters = {
    status: state.pendingFilters.status.slice(),
    mes: state.pendingFilters.mes.slice(),
    filial: state.pendingFilters.filial.slice(),
    regional: state.pendingFilters.regional.slice(),
    cargo: state.pendingFilters.cargo.slice(),
  };
  render();
}

function clearFilters(){
  state.filters = { status: [], mes: [], filial: [], regional: [], cargo: [] };
  state.pendingFilters = { status: [], mes: [], filial: [], regional: [], cargo: [] };
  state.campanhaFilter = "todos";
  state.search = "";
  render();
}

function fmtMoney(v){
  return v.toLocaleString("pt-BR", {style:"currency", currency:"BRL"});
}

function fmtCPF(cpf){
  if(cpf.length !== 11) return cpf;
  return cpf.slice(0,3)+"."+cpf.slice(3,6)+"."+cpf.slice(6,9)+"-"+cpf.slice(9);
}

function exportXLSX(){
  try{
    const allRecords = Object.values(state.records);
    if(allRecords.length === 0){
      state.error = "Não há dados para exportar ainda.";
      render();
      return;
    }

    // Aba 1: saldo agregado por colaborador (ignora filtros de tela, exporta tudo)
    const byCpf = {};
    allRecords.forEach(r => {
      if(!byCpf[r.cpf]){
        byCpf[r.cpf] = {
          cpf: r.cpf, nome: r.nome, cargo: r.cargo, filial: r.filial, regional: r.regional, re: r.re,
          totalPendente:0, totalPago:0, qtdPendente:0, qtdPago:0, _latest:0,
          listaPendentes: [], listaPagas: [],
        };
      }
      const e = byCpf[r.cpf];
      if(r.atualizadoEm >= e._latest){
        e._latest = r.atualizadoEm;
        e.nome = r.nome || e.nome;
        e.cargo = r.cargo || e.cargo;
        e.filial = r.filial || e.filial;
        e.regional = r.regional || e.regional;
        e.re = r.re || e.re;
      }
      const rotulo = r.campanha + (r.mes ? " (" + r.mes + ")" : "") + " — " + fmtMoney(r.premiacao);
      if(r.statusPremiacao === "Pendente"){ e.totalPendente += r.premiacao; e.qtdPendente++; e.listaPendentes.push(rotulo); }
      else if(r.statusPremiacao === "Pago"){ e.totalPago += r.premiacao; e.qtdPago++; e.listaPagas.push(rotulo); }
    });
    const saldoList = Object.values(byCpf).sort((a,b) => b.totalPendente - a.totalPendente || naturalCompare(a.nome, b.nome));

    const saldoHeader = ["CPF","RE (Matrícula)","Nome","Cargo","Filial","Regional","Saldo Pendente","Total Pago","Qtd. Campanhas Pendentes","Qtd. Campanhas Pagas","Campanhas Pendentes","Campanhas Pagas"];
    const saldoRows = saldoList.map(e => [
      e.cpf, e.re, e.nome, e.cargo, e.filial, e.regional,
      Number(e.totalPendente.toFixed(2)), Number(e.totalPago.toFixed(2)),
      e.qtdPendente, e.qtdPago,
      e.listaPendentes.join("; "), e.listaPagas.join("; ")
    ]);
    const wsSaldo = XLSX.utils.aoa_to_sheet([saldoHeader, ...saldoRows]);
    wsSaldo["!cols"] = [{wch:16},{wch:14},{wch:28},{wch:18},{wch:14},{wch:14},{wch:16},{wch:14},{wch:14},{wch:14},{wch:42},{wch:42}];

    // Aba 2: detalhe, uma linha por campanha
    const detHeader = ["Filial","Regional","RE","Nome","Cargo","CPF","Status Filial","Status Colaborador","Premiação","Mês","Descrição Campanha","Status Premiação"];
    const detRows = allRecords
      .sort((a,b) => naturalCompare(a.nome, b.nome) || naturalCompare(a.mes, b.mes))
      .map(r => [
        r.filial, r.regional, r.re, r.nome, r.cargo, r.cpf,
        r.statusFilial, r.statusColaborador, Number(r.premiacao.toFixed(2)),
        r.mes, r.campanha, r.statusPremiacao
      ]);
    const wsDet = XLSX.utils.aoa_to_sheet([detHeader, ...detRows]);
    wsDet["!cols"] = [{wch:10},{wch:12},{wch:8},{wch:28},{wch:18},{wch:16},{wch:14},{wch:16},{wch:12},{wch:10},{wch:26},{wch:16}];

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, wsSaldo, "Saldo por Colaborador");
    XLSX.utils.book_append_sheet(wb, wsDet, "Detalhe Campanhas");

    const dateStr = new Date().toISOString().slice(0,10);
    XLSX.writeFile(wb, "central-campanhas-" + dateStr + ".xlsx");
  }catch(e){
    state.error = "Erro ao gerar o XLSX: " + e.message;
    render();
  }
}

function renderLogin(){
  const root = document.getElementById("root");
  let html = '<div class="login-wrap"><div class="login-card">';
  html += '<h1>Central de Campanhas</h1>';
  html += '<p class="sub">Entre com a conta cadastrada para acessar os dados.</p>';
  if(state.loginError){
    html += '<div class="login-error">'+state.loginError+'</div>';
  }
  html += '<label for="loginEmail">E-mail</label>';
  html += '<input type="text" id="loginEmail" autocomplete="username" value="'+(state.loginEmail||"").replace(/"/g,"&quot;")+'">';
  html += '<label for="loginPassword">Senha</label>';
  html += '<input type="password" id="loginPassword" autocomplete="current-password" value="'+(state.loginPassword||"").replace(/"/g,"&quot;")+'">';
  html += '<button id="loginBtn"'+(state.loginBusy?" disabled":"")+'>'+(state.loginBusy?"Entrando…":"Entrar")+'</button>';
  html += '</div></div>';
  root.innerHTML = html;

  const emailInput = document.getElementById("loginEmail");
  const passInput = document.getElementById("loginPassword");
  emailInput.addEventListener("input", e => { state.loginEmail = e.target.value; });
  passInput.addEventListener("input", e => { state.loginPassword = e.target.value; });
  const submit = () => handleLogin();
  document.getElementById("loginBtn").addEventListener("click", submit);
  [emailInput, passInput].forEach(inp => inp.addEventListener("keydown", e => {
    if(e.key === "Enter") submit();
  }));
}

function render(){
  const root = document.getElementById("root");

  if(!state.authReady){
    root.innerHTML = '<div class="loading">Carregando…</div>';
    return;
  }
  if(!state.session){
    renderLogin();
    return;
  }
  if(state.loading){
    root.innerHTML = '<div class="loading">Carregando dados…</div>';
    return;
  }

  const scrollX = window.scrollX;
  const scrollY = window.scrollY;
  const searchWasFocused = document.activeElement && document.activeElement.id === "searchInput";
  const searchSelStart = searchWasFocused ? document.activeElement.selectionStart : null;
  const openFilterKeys = Array.from(document.querySelectorAll("details.multi-filter[open]")).map(d => d.getAttribute("data-filter-key"));

  const list = aggregate();
  const totalPendenteGeral = list.reduce((s,e)=>s+e.totalPendente,0);
  const totalPagoGeral = list.reduce((s,e)=>s+e.totalPago,0);

  let html = '';

  html += '<div class="masthead">';
  html += '<div><h1>Central de Campanhas</h1><p>Painel de acompanhamento por colaborador — atualizado automaticamente</p></div>';
  html += '<div class="stats">';
  html += '<div class="stat-item"><span class="label">Colaboradores</span><span class="value">'+list.length+'</span></div>';
  html += '<div class="stat-item pend"><span class="label">Pendente</span><span class="value">'+fmtMoney(totalPendenteGeral)+'</span></div>';
  html += '<div class="stat-item pago"><span class="label">Pago</span><span class="value">'+fmtMoney(totalPagoGeral)+'</span></div>';
  html += '<div class="session-bar"><span class="who">'+(state.session.user.email||"")+'</span><button class="logout-btn" id="togglePasswordBtn">Definir senha</button><button class="logout-btn" id="logoutBtn">Sair</button></div>';
  html += '</div></div>';

  if(state.error){
    html += '<div class="error-banner">'+state.error+'</div>';
  }

  if(state.passwordFormOpen){
    html += '<div class="password-panel">';
    html += '<h3>Definir senha</h3>';
    if(state.passwordMsg){
      html += '<div class="password-msg '+state.passwordMsg.type+'">'+state.passwordMsg.text+'</div>';
    }
    html += '<div class="password-row">';
    html += '<input type="password" id="newPassword" placeholder="Nova senha" value="'+(state.newPassword||"").replace(/"/g,"&quot;")+'">';
    html += '<input type="password" id="newPassword2" placeholder="Confirmar senha" value="'+(state.newPassword2||"").replace(/"/g,"&quot;")+'">';
    html += '<button class="btn" id="savePasswordBtn"'+(state.passwordBusy?" disabled":"")+'>'+(state.passwordBusy?"Salvando…":"Salvar")+'</button>';
    html += '</div></div>';
  }

  html += '<div class="panel">';
  html += '<div class="panel-sticky">';
  html += '<div class="panel-head">';
  html += '<h2>Saldo por colaborador</h2>';
  html += '<div class="controls">';
  html += '<input type="text" id="searchInput" placeholder="Buscar por nome, CPF ou RE" value="'+state.search.replace(/"/g,'&quot;')+'">';
  html += renderMultiFilter('status', 'Status', [{value:'pendente',label:'Com pendência'},{value:'sem_pendencia',label:'Sem pendência'}]);
  html += renderMultiFilter('mes', 'Mês', distinctMonths());
  html += renderMultiFilter('filial', 'Filial', distinctFiliais());
  html += renderMultiFilter('regional', 'Regional', distinctRegionais());
  html += renderMultiFilter('cargo', 'Cargo', distinctCargos());
  html += '<button class="btn btn-accent" id="applyFiltersBtn">Aplicar</button>';
  html += '<button class="btn danger" id="clearFiltersBtn">Limpar filtros</button>';
  html += '<button class="btn" id="exportBtn">Baixar XLSX</button>';
  html += '</div></div>';

  html += '<div class="meta-info">';
  html += '<span>Painel atualizado às '+fmtDateTime(state.lastSystemRefresh)+'</span>';
  html += '<span>Dados alterados pela última vez em '+fmtDateTime(lastDbUpdate())+'</span>';
  html += '</div>';

  const campanhas = distinctCampanhas();
  if(campanhas.length > 0){
    html += '<div class="sheet-tabs">';
    html += '<button class="sheet-tab'+(state.campanhaFilter==="todos"?" active":"")+'" data-campanha="todos">Todas as campanhas</button>';
    campanhas.forEach(c => {
      html += '<button class="sheet-tab'+(state.campanhaFilter===c?" active":"")+'" data-campanha="'+c.replace(/"/g,"&quot;")+'">'+c+'</button>';
    });
    html += '</div>';
  }
  html += '</div>';

  if(list.length === 0){
    html += '<div class="empty">';
    if(Object.keys(state.records).length === 0){
      html += 'Nenhum dado disponível ainda. Assim que os dados forem cadastrados no Supabase, eles aparecem aqui automaticamente.';
    } else {
      html += 'Nenhum colaborador encontrado para este filtro.';
    }
    html += '</div>';
  } else {
    html += '<div class="table-scroll">';
    html += '<table><thead><tr>';
    html += thSort('Filial', 'filial');
    html += thSort('Regional', 'regional');
    html += thSort('RE', 're');
    html += thSort('Colaborador', 'nome');
    html += thSort('Cargo', 'cargo');
    html += thSort('CPF', 'cpf');
    html += thSort('Pendente', 'totalPendente', 'num');
    html += thSort('Pago', 'totalPago', 'num');
    html += thSort('Campanhas Pendentes', 'qtdPendente', 'num');
    html += '</tr></thead><tbody>';
    list.forEach(e => {
      const isOpen = state.expanded === e.cpf;
      html += '<tr class="emp-row" data-cpf="'+e.cpf+'">';
      html += '<td>'+ (e.filial || '—') +'</td>';
      html += '<td>'+ (e.regional || '—') +'</td>';
      html += '<td>'+ (e.re || '—') +'</td>';
      html += '<td class="nome">'+ (e.nome || '(sem nome)') +'</td>';
      html += '<td class="cargo">'+ (e.cargo || '—') +'</td>';
      html += '<td>'+fmtCPF(e.cpf)+'</td>';
      html += '<td class="num">'+ (e.totalPendente>0 ? '<span class="pill pend">'+fmtMoney(e.totalPendente)+'</span>' : fmtMoney(0)) +'</td>';
      html += '<td class="num">'+ (e.totalPago>0 ? '<span class="pill pago">'+fmtMoney(e.totalPago)+'</span>' : fmtMoney(0)) +'</td>';
      html += '<td class="num">'+e.qtdPendente+'</td>';
      html += '</tr>';
      if(isOpen){
        html += '<tr class="detail-row"><td colspan="9"><div class="detail-inner">';
        html += '<table><thead><tr><th>Campanha</th><th>Mês</th><th class="num">Valor</th><th>Status</th></tr></thead><tbody>';
        e.campanhas.sort((a,b)=> naturalCompare(a.mes, b.mes) || naturalCompare(a.campanha, b.campanha))
          .forEach(c => {
            html += '<tr><td>'+c.campanha+'</td><td>'+c.mes+'</td><td class="num">'+fmtMoney(c.premiacao)+'</td><td><span class="pill '+(c.status==="Pago"?"pago":"pend")+'">'+c.status+'</span></td></tr>';
          });
        html += '</tbody></table></div></td></tr>';
      }
    });
    html += '</tbody></table>';
    html += '</div>';
  }

  html += '</div>';

  root.innerHTML = html;
  attachEvents();

  if(searchWasFocused){
    const newSearchInput = document.getElementById("searchInput");
    if(newSearchInput){
      newSearchInput.focus();
      newSearchInput.setSelectionRange(searchSelStart, searchSelStart);
    }
  }
  openFilterKeys.forEach(key => {
    const d = document.querySelector('details.multi-filter[data-filter-key="'+key+'"]');
    if(d) d.setAttribute("open", "");
  });
  window.scrollTo(scrollX, scrollY);
}

function attachEvents(){
  const logoutBtn = document.getElementById("logoutBtn");
  if(logoutBtn){
    logoutBtn.addEventListener("click", handleLogout);
  }
  const togglePasswordBtn = document.getElementById("togglePasswordBtn");
  if(togglePasswordBtn){
    togglePasswordBtn.addEventListener("click", () => {
      state.passwordFormOpen = !state.passwordFormOpen;
      state.passwordMsg = null;
      render();
    });
  }
  const newPasswordInput = document.getElementById("newPassword");
  if(newPasswordInput){
    newPasswordInput.addEventListener("input", (e) => { state.newPassword = e.target.value; });
  }
  const newPassword2Input = document.getElementById("newPassword2");
  if(newPassword2Input){
    newPassword2Input.addEventListener("input", (e) => { state.newPassword2 = e.target.value; });
  }
  const savePasswordBtn = document.getElementById("savePasswordBtn");
  if(savePasswordBtn){
    savePasswordBtn.addEventListener("click", handleSetPassword);
  }
  const searchInput = document.getElementById("searchInput");
  if(searchInput){
    searchInput.addEventListener("input", (e) => { state.search = e.target.value; render(); });
  }
  document.querySelectorAll(".multi-filter-options input[type=checkbox]").forEach(cb => {
    cb.addEventListener("change", (e) => {
      const key = e.target.getAttribute("data-filter-key");
      const val = e.target.value;
      const arr = state.pendingFilters[key];
      const idx = arr.indexOf(val);
      if(e.target.checked){
        if(idx === -1) arr.push(val);
      } else if(idx !== -1){
        arr.splice(idx, 1);
      }
      // Atualiza só o texto do resumo, sem re-renderizar (isso fecharia o
      // <details> no meio da seleção de várias caixas).
      const details = e.target.closest("details.multi-filter");
      const summary = details.querySelector("summary");
      const label = details.getAttribute("data-label");
      summary.textContent = arr.length > 0 ? label + " (" + arr.length + ")" : label;
    });
  });
  const applyFiltersBtn = document.getElementById("applyFiltersBtn");
  if(applyFiltersBtn){
    applyFiltersBtn.addEventListener("click", applyFilters);
  }
  const clearFiltersBtn = document.getElementById("clearFiltersBtn");
  if(clearFiltersBtn){
    clearFiltersBtn.addEventListener("click", clearFilters);
  }
  document.querySelectorAll("th.sortable").forEach(th => {
    th.addEventListener("click", () => {
      const col = th.getAttribute("data-sort");
      if(state.sortColumn === col){
        state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
      } else {
        state.sortColumn = col;
        state.sortDir = "asc";
      }
      render();
    });
  });
  document.querySelectorAll(".sheet-tab").forEach(tab => {
    tab.addEventListener("click", () => { state.campanhaFilter = tab.getAttribute("data-campanha"); render(); });
  });
  const exportBtn = document.getElementById("exportBtn");
  if(exportBtn){
    exportBtn.addEventListener("click", exportXLSX);
  }
  document.querySelectorAll(".emp-row").forEach(row => {
    row.addEventListener("click", () => {
      const cpf = row.getAttribute("data-cpf");
      state.expanded = state.expanded === cpf ? null : cpf;
      render();
    });
  });
}

initAuth();
