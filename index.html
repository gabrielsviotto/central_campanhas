<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central de Campanhas</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  --ink:#1B1E1C;
  --ink-soft:#262A27;
  --paper:#F4F0E4;
  --paper-line:#E2DCC9;
  --paper-dim:#DFD8C4;
  --amber:#C98A2B;
  --amber-bg:#F4E3C4;
  --teal:#2F6F5E;
  --teal-bg:#D9E9E2;
  --text-dark:#2B2A28;
  --text-mute:#6B6558;
  --danger:#B5482E;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--ink);
  color:var(--paper);
  font-family:'IBM Plex Sans', sans-serif;
  min-height:100vh;
}
.app{
  max-width:1080px;
  margin:0 auto;
  padding:32px 20px 60px;
}
.masthead{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  border-bottom:2px solid var(--paper-line);
  padding-bottom:18px;
  margin-bottom:28px;

}
.masthead h1{
  font-family:'Fraunces', serif;
  font-weight:700;
  font-size:34px;
  letter-spacing:-0.5px;
  margin:0;
  color:var(--paper);
}
.masthead p{
  margin:4px 0 0;
  color:#B9B6A8;
  font-size:14px;
}
.stats{
  display:flex;
  gap:18px;
  align-items:flex-end;
  text-align:right;
  font-family:'IBM Plex Mono', monospace;
}
.stat-item .label{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:0.06em;
  color:#8C8878;

}
.stat-item .value{

  font-weight:600;
  color:var(--paper);
}
.stat-item.pend .value{color:var(--amber);}
.stat-item.pago .value{color:var(--teal);}

/* upload zone */
.dropzone{
  border:2px dashed #4A4E47;
  border-radius:10px;
  padding:26px;
  text-align:center;
  cursor:pointer;
  transition:border-color .15s, background .15s;
  background:var(--ink-soft);
  margin-bottom:22px;
}
.dropzone:hover, .dropzone.drag{
  border-color:var(--amber);
  background:#2A2E27;
}
.dropzone .dz-title{
  font-family:'Fraunces', serif;
  font-size:17px;
  font-weight:600;
  color:var(--paper);
  margin-bottom:4px;
}
.dropzone .dz-sub{
  font-size:13px;
  color:#8C8878;
}
input[type=file]{display:none;}

/* receipt toast (signature element) */
.receipt-wrap{
  display:flex;
  justify-content:center;
  margin-bottom:22px;
  animation:drop 0.35s ease-out;
}
@keyframes drop{
  from{opacity:0; transform:translateY(-8px);}
  to{opacity:1; transform:translateY(0);}
}
.receipt{
  background:var(--paper);
  color:var(--text-dark);
  font-family:'IBM Plex Mono', monospace;
  font-size:13px;
  width:340px;
  padding:16px 20px 14px;
  position:relative;
  box-shadow:0 10px 24px rgba(0,0,0,0.35);
  border-bottom:1px dashed #B8B196;
}
.receipt::before, .receipt::after{
  content:"";
  position:absolute;
  left:0; right:0;
  height:8px;
  background-image: linear-gradient(135deg, var(--paper) 50%, transparent 50%), linear-gradient(45deg, var(--paper) 50%, transparent 50%);
  background-size:12px 12px;
  background-repeat:repeat-x;
}
.receipt::before{top:-8px;}
.receipt::after{bottom:-8px; background-image: linear-gradient(45deg, var(--paper) 50%, transparent 50%), linear-gradient(135deg, var(--paper) 50%, transparent 50%); background-position:0 0;}
.receipt h3{
  font-family:'Fraunces', serif;
  font-size:15px;
  margin:0 0 8px;
  text-align:center;
  letter-spacing:0.03em;
}
.receipt .rline{
  display:flex;
  justify-content:space-between;
  padding:2px 0;
}
.receipt .rline.total{
  border-top:1px dashed #B8B196;
  margin-top:6px;
  padding-top:6px;
  font-weight:600;
}
.receipt .close-r{
  display:block;
  margin:10px auto 0;
  background:none;
  border:1px solid #B8B196;
  color:var(--text-mute);
  font-family:'IBM Plex Sans', sans-serif;
  font-size:11px;
  padding:4px 10px;
  border-radius:20px;
  cursor:pointer;
}

.error-banner{
  background:#3A2420;
  border:1px solid var(--danger);
  color:#F0C7B8;
  padding:10px 14px;
  border-radius:6px;
  font-size:13px;
  margin-bottom:16px;

.log-toggle-wrap{

.log-box thead th{

}

.log-box tbody td{

.log-box tbody tr:last-child td{border-bottom:none;}
.log-box .hint{color:#8C8878; font-size:12px; text-align:center; padding:10px 0;}

.panel{

.panel-head{

}
.controls input[type=text]{
  padding:7px 10px;
  border:1px solid var(--paper-dim);

.controls select{
  padding:7px 10px;
  border:1px solid var(--paper-dim);
  border-radius:6px;
  font-family:'IBM Plex Sans', sans-serif;
  font-size:13px;
  background:#fff;
}
.btn{
  padding:7px 12px;
  border-radius:6px;
  border:1px solid var(--paper-dim);
  background:#fff;
  font-size:13px;
  cursor:pointer;
  color:var(--text-dark);
  font-family:'IBM Plex Sans', sans-serif;
}
.btn:hover{background:#EDE7D6;}
.btn.danger{
  color:var(--danger);
  border-color:#D6A392;
}
.btn:disabled{opacity:0.55; cursor:default;}

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}
thead th{
  text-align:left;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:0.05em;
  color:var(--text-mute);
  padding:8px 10px;
  border-bottom:2px solid var(--paper-dim);
}
thead th.num{text-align:right;}
tbody tr{
  border-bottom:1px solid var(--paper-line);
  cursor:pointer;
}
tbody tr:hover{background:#EDE7D6;}
tbody td{
  padding:10px 10px;
  vertical-align:top;
}
td.num{
  text-align:right;
  font-family:'IBM Plex Mono', monospace;
}
td.nome{font-weight:600;}
td.cargo{color:var(--text-mute); font-size:13px;}
.pill{
  display:inline-block;
  padding:2px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:600;
  font-family:'IBM Plex Mono', monospace;
}
.pill.pend{background:var(--amber-bg); color:var(--amber);}
.pill.pago{background:var(--teal-bg); color:var(--teal);}

.detail-row td{
  background:#EDE7D6;
  padding:0;
}
.detail-inner{padding:6px 14px 14px 34px;}
.detail-inner table{font-size:13px;}
.detail-inner thead th{border-bottom:1px solid var(--paper-dim); font-size:10px;}
.detail-inner tbody tr{cursor:default; border-bottom:1px solid #E2DCC9;}
.detail-inner tbody tr:hover{background:transparent;}

.empty{
  text-align:center;
  padding:40px 20px;
  color:var(--text-mute);
}
.empty b{color:var(--text-dark);}

.modal-back{
  position:fixed; inset:0;
  background:rgba(0,0,0,0.55);
  display:flex; align-items:center; justify-content:center;
  z-index:50;
}
.modal{
  background:var(--paper);
  color:var(--text-dark);
  padding:22px;
  border-radius:10px;
  width:320px;
}
.modal h3{margin:0 0 8px; font-family:'Fraunces',serif;}
.modal p{font-size:13px; color:var(--text-mute); margin-bottom:16px;}
.modal .row{display:flex; gap:8px; justify-content:flex-end;}

.loading{
  text-align:center;
  padding:60px;
  color:#8C8878;
  font-family:'IBM Plex Mono', monospace;
}

<body>
<div id="root" class="app"><div class="loading">Carregando…</div></div>

<script>
// ---------------------------------------------------------------------------
// Configuração do Supabase. Preencha com os dados do seu projeto
// (Project Settings -> API). A "anon key" é pública por natureza — a
// segurança dos dados vem das políticas de Row Level Security (RLS) do banco,
// não do sigilo dessa chave.
// ---------------------------------------------------------------------------
const SUPABASE_URL = "https://SEU-PROJETO.supabase.co";
const SUPABASE_ANON_KEY = "SUA_ANON_KEY_AQUI";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const APP_STATE_ROW_ID = 1; // linha única que guarda todo o estado (records + log)

let state = {
  loading: true,
  error: null,
  records: {},     // map key -> record
  log: [],          // upload history
  lastReceipt: null,
  search: "",
  statusFilter: "todos",
  expanded: null,
  dragOver: false,
  confirmClear: false,
  gsheetTab: "link",
  gsheetLink: "",
  pasteText: "",
  showLog: false,
  mesFilter: "todos",
};

function normText(s){
  return String(s||"")
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .toLowerCase().trim().replace(/\s+/g," ");
}

function mapHeader(h){
  const n = normText(h);
  if(n === "status filial") return "statusFilial";
  if(n === "status colaborador") return "statusColaborador";
  if(n === "status premiacao" || n === "status premiação") return "statusPremiacao";
  if(n.includes("descricao") && n.includes("campanha")) return "campanha";
  if(n === "campanha") return "campanha";
  if(n === "filial") return "filial";
  if(n === "regional") return "regional";
  if(n === "re") return "re";
  if(n === "nome") return "nome";
  if(n === "cargo") return "cargo";
  if(n === "cpf") return "cpf";
  if(n === "mes" || n === "mês") return "mes";
  if(n.includes("premia")) return "premiacao";
  return null;
}

function parseCPF(v){
  if(v == null) return "";
  const s = String(v).replace(/\D/g,"");
  if(!s) return "";
  return s.padStart(11,"0");
}

function parseValor(v){
  if(v == null || v === "") return 0;
  if(typeof v === "number") return v;
  let s = String(v).trim().replace(/[Rr]\$/g,"").trim();
  if(s.includes(",")){
    s = s.replace(/\./g,"").replace(",",".");
  }
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

function parseMes(v){
  if(v == null) return "";
  if(v instanceof Date){
    const mm = String(v.getMonth()+1).padStart(2,"0");
    return mm + "/" + v.getFullYear();
  }
  return String(v).trim();
}

function parseStatus(v){
  const s = normText(v);
  if(s.startsWith("pago")) return "Pago";
  if(s.startsWith("pend")) return "Pendente";
  return String(v||"").trim() || "Pendente";
}

// ---------------------------------------------------------------------------
// Persistência: um único registro em "app_state" guarda todo o estado
// (equivalente ao antigo window.storage).
// ---------------------------------------------------------------------------
async function loadData(){
  try{
    const { data, error } = await sb
      .from("app_state")
      .select("data")
      .eq("id", APP_STATE_ROW_ID)
      .maybeSingle();
    if(error) throw error;
    if(data && data.data){
      state.records = data.data.records || {};
      state.log = data.data.log || [];
    }
  }catch(e){
    state.error = "Erro ao carregar dados do Supabase: " + e.message;
  }
  state.loading = false;
  render();
}

async function persist(){
  try{
    const { error } = await sb
      .from("app_state")
      .upsert({
        id: APP_STATE_ROW_ID,
        data: { records: state.records, log: state.log },
        updated_at: new Date().toISOString(),
      });
    if(error) throw error;
  }catch(e){
    state.error = "Erro ao salvar dados: " + e.message;
  }
}

function recordKey(r){
  return r.cpf + "__" + normText(r.campanha) + "__" + normText(r.mes);
}

function processWorkbook(rows, filename){
  if(!rows.length){
    state.error = "A planilha parece estar vazia.";
    render();
    return;
  }
  const headerRow = rows[0];
  const headerMap = headerRow.map(mapHeader);

  if(!headerMap.includes("cpf") || !headerMap.includes("statusPremiacao")){
    state.error = "Não encontrei as colunas CPF e/ou Status Premiação nesta planilha. Confira os cabeçalhos.";
    render();
    return;
  }

  const dataRows = rows.slice(1).filter(r => r.some(c => c !== "" && c != null));
  let novos = 0, paraPago = 0, atualizados = 0, semAlteracao = 0, invalidas = 0;

  dataRows.forEach(row => {
    const obj = {};
    headerMap.forEach((canon, i) => {
      if(canon) obj[canon] = row[i];
    });
    const cpf = parseCPF(obj.cpf);
    if(!cpf){ invalidas++; return; }

    const record = {
      cpf,
      nome: String(obj.nome||"").trim(),
      cargo: String(obj.cargo||"").trim(),
      filial: String(obj.filial||"").trim(),
      regional: String(obj.regional||"").trim(),
      re: String(obj.re||"").trim(),
      statusFilial: String(obj.statusFilial||"").trim(),
      statusColaborador: String(obj.statusColaborador||"").trim(),
      campanha: String(obj.campanha||"").trim(),
      mes: parseMes(obj.mes),
      premiacao: parseValor(obj.premiacao),
      statusPremiacao: parseStatus(obj.statusPremiacao),
      atualizadoEm: Date.now(),
    };
    const key = recordKey(record);
    const prev = state.records[key];
    if(!prev){
      novos++;
    } else if(prev.statusPremiacao !== record.statusPremiacao){
      if(record.statusPremiacao === "Pago") paraPago++;
      else atualizados++;
    } else {
      semAlteracao++;
    }
    state.records[key] = record;
  });

  const receipt = {
    filename,
    novos, paraPago, atualizados, semAlteracao, invalidas,
    totalProcessadas: dataRows.length,
    timestamp: new Date().toLocaleString("pt-BR"),
  };
  state.lastReceipt = receipt;
  state.log.unshift(receipt);
  state.log = state.log.slice(0, 20);
  state.error = null;
  persist();
  render();
}

function handleFile(file){
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:"array", cellDates:true});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:""});
      processWorkbook(rows, file.name);
    }catch(err){
      state.error = "Erro ao ler o arquivo: " + err.message;
      render();
    }
  };
  reader.onerror = () => {
    state.error = "Não foi possível ler o arquivo.";
    render();
  };
  reader.readAsArrayBuffer(file);
}

async function fetchGoogleSheet(url){
  if(!url || !url.trim()){
    state.error = "Cole o link da aba do Google Sheets antes de buscar.";
    render();
    return;
  }
  const idMatch = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
  if(!idMatch){
    state.error = "Não consegui identificar o ID da planilha nesse link. Confira se é um link válido do Google Sheets.";
    render();
    return;
  }
  const gidMatch = url.match(/gid=([0-9]+)/);
  const gid = gidMatch ? gidMatch[1] : "0";
  const exportUrl = "https://docs.google.com/spreadsheets/d/" + idMatch[1] + "/export?format=csv&gid=" + gid;
  try{
    const resp = await fetch(exportUrl);
    if(!resp.ok) throw new Error("a planilha respondeu com erro " + resp.status);
    const text = await resp.text();
    if(text.trim().toLowerCase().startsWith("<")){
      throw new Error("a aba não parece estar pública");
    }
    const parsed = Papa.parse(text, {skipEmptyLines:true});
    processWorkbook(parsed.data, "Google Sheets (gid " + gid + ")");
  }catch(e){
    state.error = 'Não foi possível buscar essa aba diretamente (' + e.message + '). Confirme se o compartilhamento está como "Qualquer pessoa com o link → Leitor", ou use a aba "Colar dados" abaixo, que sempre funciona.';
    render();
  }
}

function processPastedData(){
  if(!state.pasteText || !state.pasteText.trim()){
    state.error = "Cole os dados da planilha antes de processar.";
    render();
    return;
  }
  const parsed = Papa.parse(state.pasteText, {skipEmptyLines:true});
  state.pasteText = "";
  processWorkbook(parsed.data, "Colado do Google Sheets");
}

function mesSortKey(mes){
  const m = String(mes||"").trim().match(/^(\d{1,2})\/(\d{4})$/);
  if(m) return parseInt(m[2],10)*100 + parseInt(m[1],10);
  return null;
}

function distinctMonths(){
  const set = new Set();
  Object.values(state.records).forEach(r => { if(r.mes) set.add(r.mes); });
  const arr = Array.from(set);
  arr.sort((a,b) => {
    const ka = mesSortKey(a), kb = mesSortKey(b);
    if(ka != null && kb != null) return ka - kb;
    if(ka != null) return -1;
    if(kb != null) return 1;
    return String(a).localeCompare(String(b));
  });
  return arr;
}

function aggregate(){
  const byCpf = {};
  let baseRecords = Object.values(state.records);
  if(state.mesFilter !== "todos"){
    baseRecords = baseRecords.filter(r => r.mes === state.mesFilter);
  }
  baseRecords.forEach(r => {
    if(!byCpf[r.cpf]){
      byCpf[r.cpf] = {
        cpf: r.cpf, nome: r.nome, cargo: r.cargo, filial: r.filial, regional: r.regional, re: r.re,
        totalPendente:0, totalPago:0, qtdPendente:0, qtdPago:0,
        campanhas: [], _latest: 0,
      };
    }
    const e = byCpf[r.cpf];
    if(r.atualizadoEm >= e._latest){
      e._latest = r.atualizadoEm;
      e.nome = r.nome || e.nome;
      e.cargo = r.cargo || e.cargo;
      e.filial = r.filial || e.filial;
      e.regional = r.regional || e.regional;
      e.re = r.re || e.re;
    }
    e.campanhas.push({campanha: r.campanha, mes: r.mes, premiacao: r.premiacao, status: r.statusPremiacao});
    if(r.statusPremiacao === "Pendente"){ e.totalPendente += r.premiacao; e.qtdPendente++; }
    else if(r.statusPremiacao === "Pago"){ e.totalPago += r.premiacao; e.qtdPago++; }
  });
  let list = Object.values(byCpf);

  if(state.search.trim()){
    const q = normText(state.search);
    const qDigits = q.replace(/\D/g,"");
    list = list.filter(e =>
      normText(e.nome).includes(q) ||
      (qDigits && e.cpf.includes(qDigits)) ||
      (qDigits && normText(e.re).includes(qDigits)) ||
      normText(e.re).includes(q)
    );
  }
  if(state.statusFilter === "pendente"){
    list = list.filter(e => e.qtdPendente > 0);
  } else if(state.statusFilter === "sem_pendencia"){
    list = list.filter(e => e.qtdPendente === 0);
  }

  list.sort((a,b) => b.totalPendente - a.totalPendente || a.nome.localeCompare(b.nome));
  return list;
}

function fmtMoney(v){
  return v.toLocaleString("pt-BR", {style:"currency", currency:"BRL"});
}

function fmtCPF(cpf){
  if(cpf.length !== 11) return cpf;
  return cpf.slice(0,3)+"."+cpf.slice(3,6)+"."+cpf.slice(6,9)+"-"+cpf.slice(9);
}

async function clearAll(){
  state.records = {};
  state.log = [];
  state.lastReceipt = null;
  state.confirmClear = false;
  try{
    const { error } = await sb
      .from("app_state")
      .upsert({
        id: APP_STATE_ROW_ID,
        data: { records: {}, log: [] },
        updated_at: new Date().toISOString(),
      });
    if(error) throw error;
  }catch(e){
    state.error = "Erro ao limpar dados: " + e.message;
  }
  render();
}

function exportXLSX(){
  try{
    const allRecords = Object.values(state.records);
    if(allRecords.length === 0){
      state.error = "Não há dados para exportar ainda.";
      render();
      return;
    }

    // Aba 1: saldo agregado por colaborador (ignora filtros de tela, exporta tudo)
    const byCpf = {};
    allRecords.forEach(r => {
      if(!byCpf[r.cpf]){
        byCpf[r.cpf] = {
          cpf: r.cpf, nome: r.nome, cargo: r.cargo, filial: r.filial, regional: r.regional, re: r.re,
          totalPendente:0, totalPago:0, qtdPendente:0, qtdPago:0, _latest:0,
          listaPendentes: [], listaPagas: [],
        };
      }
      const e = byCpf[r.cpf];
      if(r.atualizadoEm >= e._latest){
        e._latest = r.atualizadoEm;
        e.nome = r.nome || e.nome;
        e.cargo = r.cargo || e.cargo;
        e.filial = r.filial || e.filial;
        e.regional = r.regional || e.regional;
        e.re = r.re || e.re;
      }
      const rotulo = r.campanha + (r.mes ? " (" + r.mes + ")" : "") + " — " + fmtMoney(r.premiacao);
      if(r.statusPremiacao === "Pendente"){ e.totalPendente += r.premiacao; e.qtdPendente++; e.listaPendentes.push(rotulo); }
      else if(r.statusPremiacao === "Pago"){ e.totalPago += r.premiacao; e.qtdPago++; e.listaPagas.push(rotulo); }
    });
    const saldoList = Object.values(byCpf).sort((a,b) => b.totalPendente - a.totalPendente || a.nome.localeCompare(b.nome));

    const saldoHeader = ["CPF","RE (Matrícula)","Nome","Cargo","Filial","Regional","Saldo Pendente","Total Pago","Qtd. Campanhas Pendentes","Qtd. Campanhas Pagas","Campanhas Pendentes","Campanhas Pagas"];
    const saldoRows = saldoList.map(e => [
      e.cpf, e.re, e.nome, e.cargo, e.filial, e.regional,
      Number(e.totalPendente.toFixed(2)), Number(e.totalPago.toFixed(2)),
      e.qtdPendente, e.qtdPago,
      e.listaPendentes.join("; "), e.listaPagas.join("; ")
    ]);
    const wsSaldo = XLSX.utils.aoa_to_sheet([saldoHeader, ...saldoRows]);
    wsSaldo["!cols"] = [{wch:16},{wch:14},{wch:28},{wch:18},{wch:14},{wch:14},{wch:16},{wch:14},{wch:14},{wch:14},{wch:42},{wch:42}];

    // Aba 2: detalhe, mesma estrutura das planilhas de entrada
    const detHeader = ["Filial","Regional","RE","Nome","Cargo","CPF","Status Filial","Status Colaborador","Premiação","Mês","Descrição Campanha","Status Premiação"];
    const detRows = allRecords
      .sort((a,b) => a.nome.localeCompare(b.nome) || (a.mes||"").localeCompare(b.mes||""))
      .map(r => [
        r.filial, r.regional, r.re, r.nome, r.cargo, r.cpf,
        r.statusFilial, r.statusColaborador, Number(r.premiacao.toFixed(2)),
        r.mes, r.campanha, r.statusPremiacao
      ]);
    const wsDet = XLSX.utils.aoa_to_sheet([detHeader, ...detRows]);
    wsDet["!cols"] = [{wch:10},{wch:12},{wch:8},{wch:28},{wch:18},{wch:16},{wch:14},{wch:16},{wch:12},{wch:10},{wch:26},{wch:16}];

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, wsSaldo, "Saldo por Colaborador");
    XLSX.utils.book_append_sheet(wb, wsDet, "Detalhe Campanhas");

    const dateStr = new Date().toISOString().slice(0,10);
    XLSX.writeFile(wb, "central-campanhas-" + dateStr + ".xlsx");
  }catch(e){
    state.error = "Erro ao gerar o XLSX: " + e.message;
    render();
  }
}

function render(){
  const root = document.getElementById("root");
  if(state.loading){
    root.innerHTML = '<div class="loading">Carregando dados salvos…</div>';
    return;
  }

  const list = aggregate();
  const totalPendenteGeral = list.reduce((s,e)=>s+e.totalPendente,0);
  const totalPagoGeral = list.reduce((s,e)=>s+e.totalPago,0);

  let html = '';

  html += '<div class="masthead">';
  html += '<div><h1>Central de Campanhas</h1><p>Solte as planilhas de apuração e acompanhe o saldo por colaborador</p></div>';
  html += '<div class="stats">';
  html += '<div class="stat-item"><span class="label">Colaboradores</span><span class="value">'+list.length+'</span></div>';
  html += '<div class="stat-item pend"><span class="label">Pendente</span><span class="value">'+fmtMoney(totalPendenteGeral)+'</span></div>';
  html += '<div class="stat-item pago"><span class="label">Pago</span><span class="value">'+fmtMoney(totalPagoGeral)+'</span></div>';
  html += '</div></div>';

  if(state.error){
    html += '<div class="error-banner">'+state.error+'</div>';
  }

  html += '<div class="dropzone" id="dropzone">';
  html += '<div class="dz-title">Arraste a planilha aqui ou clique para escolher</div>';
  html += '<div class="dz-sub">.xlsx ou .csv — colunas: Filial, Regional, RE, Nome, Cargo, CPF, Status Filial, Status Colaborador, Premiação, Mês, Descrição Campanha, Status Premiação</div>';
  html += '<input type="file" id="fileInput" accept=".xlsx,.xls,.csv">';
  html += '</div>';

  html += '<div class="gsheet-box">';
  html += '<span class="gsheet-title">Importar de uma aba do Google Sheets</span>';
  html += '<div class="gsheet-tabs">';
  html += '<button class="tab-btn'+(state.gsheetTab==="link"?" active":"")+'" data-tab="link">Link da aba</button>';
  html += '<button class="tab-btn'+(state.gsheetTab==="paste"?" active":"")+'" data-tab="paste">Colar dados</button>';
  html += '</div>';
  if(state.gsheetTab === "link"){
    html += '<div class="gsheet-panel">';
    html += '<p class="hint">Funciona se a aba estiver compartilhada como "Qualquer pessoa com o link → Leitor". Abra a aba desejada e cole o link completo (com #gid=... no final).</p>';
    html += '<div class="gsheet-row"><input type="text" id="gsheetLinkInput" placeholder="https://docs.google.com/spreadsheets/d/.../edit#gid=0" value="'+ (state.gsheetLink||"").replace(/"/g,"&quot;") +'"><button class="btn on-dark" id="gsheetFetchBtn">Buscar aba</button></div>';
    html += '</div>';
  } else {
    html += '<div class="gsheet-panel">';
    html += '<p class="hint">Funciona sempre, mesmo com a planilha privada. Na aba do Google Sheets, selecione os dados com cabeçalho (Ctrl+A ou selecione o intervalo), copie (Ctrl+C) e cole aqui.</p>';
    html += '<textarea id="pasteArea" placeholder="Cole aqui os dados copiados da planilha...">'+ (state.pasteText||"") +'</textarea>';
    html += '<button class="btn on-dark" id="pasteProcessBtn">Processar dados colados</button>';
    html += '</div>';
  }
  html += '</div>';

  html += '<div class="log-toggle-wrap"><button class="btn on-dark" id="toggleLogBtn">'+(state.showLog ? "Ocultar" : "Ver") + " histórico de importações (" + state.log.length + ")</button></div>";

  if(state.showLog){
    html += '<div class="log-box">';
    if(state.log.length === 0){
      html += '<div class="hint">Nenhuma importação registrada ainda.</div>';
    } else {
      html += '<table><thead><tr><th>Planilha / aba</th><th>Quando</th><th class="num">Novos</th><th class="num">P/ pago</th><th class="num">Outras atualiz.</th><th class="num">Sem alteração</th><th class="num">Total</th></tr></thead><tbody>';
      state.log.forEach(r => {
        html += '<tr><td>'+r.filename+'</td><td>'+r.timestamp+'</td><td class="num">'+r.novos+'</td><td class="num">'+r.paraPago+'</td><td class="num">'+r.atualizados+'</td><td class="num">'+r.semAlteracao+'</td><td class="num">'+r.totalProcessadas+'</td></tr>';
      });
      html += '</tbody></table>';
    }
    html += '</div>';
  }

  if(state.lastReceipt){
    const r = state.lastReceipt;
    html += '<div class="receipt-wrap"><div class="receipt">';
    html += '<h3>COMPROVANTE DE IMPORTAÇÃO</h3>';
    html += '<div class="rline"><span>arquivo</span><span>'+r.filename.slice(0,22)+'</span></div>';
    html += '<div class="rline"><span>registros novos</span><span>'+r.novos+'</span></div>';
    html += '<div class="rline"><span>marcados como pago</span><span>'+r.paraPago+'</span></div>';
    html += '<div class="rline"><span>outras atualizações</span><span>'+r.atualizados+'</span></div>';
    html += '<div class="rline"><span>sem alteração</span><span>'+r.semAlteracao+'</span></div>';
    if(r.invalidas > 0){
      html += '<div class="rline"><span>linhas inválidas (sem CPF)</span><span>'+r.invalidas+'</span></div>';
    }
    html += '<div class="rline total"><span>total processado</span><span>'+r.totalProcessadas+'</span></div>';
    html += '<button class="close-r" id="closeReceipt">ok, fechar</button>';
    html += '</div></div>';
  }

  html += '<div class="panel">';
  html += '<div class="panel-head">';
  html += '<h2>Saldo por colaborador</h2>';
  html += '<div class="controls">';
  html += '<input type="text" id="searchInput" placeholder="Buscar por nome, CPF ou RE" value="'+state.search.replace(/"/g,'&quot;')+'">';
  html += '<select id="statusSelect">';
  html += '<option value="todos"'+(state.statusFilter==="todos"?" selected":"")+'>Todos</option>';
  html += '<option value="pendente"'+(state.statusFilter==="pendente"?" selected":"")+'>Com pendência</option>';
  html += '<option value="sem_pendencia"'+(state.statusFilter==="sem_pendencia"?" selected":"")+'>Sem pendência</option>';
  html += '</select>';
  html += '<select id="mesSelect">';
  html += '<option value="todos"'+(state.mesFilter==="todos"?" selected":"")+'>Todos os meses</option>';
  distinctMonths().forEach(m => {
    html += '<option value="'+m.replace(/"/g,"&quot;")+'"'+(state.mesFilter===m?" selected":"")+'>'+m+'</option>';
  });
  html += '</select>';
  html += '<button class="btn" id="exportBtn">Baixar XLSX</button>';
  html += '<button class="btn danger" id="clearBtn">Limpar dados</button>';
  html += '</div></div>';

  if(list.length === 0){
    html += '<div class="empty">';
    if(Object.keys(state.records).length === 0){
      html += 'Nenhum dado ainda. <b>Solte a primeira planilha de apuração acima</b> para começar.';
    } else {
      html += 'Nenhum colaborador encontrado para este filtro.';
    }
    html += '</div>';
  } else {
    html += '<table><thead><tr>';
    html += '<th>Colaborador</th><th>RE</th><th>CPF</th><th class="num">Pendente</th><th class="num">Pago</th><th class="num">Campanhas pend.</th>';
    html += '</tr></thead><tbody>';
    list.forEach(e => {
      const isOpen = state.expanded === e.cpf;
      html += '<tr class="emp-row" data-cpf="'+e.cpf+'">';
      html += '<td class="nome">'+ (e.nome || '(sem nome)') +'<div class="cargo">'+ (e.cargo||'') + (e.filial? ' · '+e.filial : '') +'</div></td>';
      html += '<td>'+ (e.re || '—') +'</td>';
      html += '<td>'+fmtCPF(e.cpf)+'</td>';
      html += '<td class="num">'+ (e.totalPendente>0 ? '<span class="pill pend">'+fmtMoney(e.totalPendente)+'</span>' : fmtMoney(0)) +'</td>';
      html += '<td class="num">'+ (e.totalPago>0 ? '<span class="pill pago">'+fmtMoney(e.totalPago)+'</span>' : fmtMoney(0)) +'</td>';
      html += '<td class="num">'+e.qtdPendente+'</td>';
      html += '</tr>';
      if(isOpen){
        html += '<tr class="detail-row"><td colspan="6"><div class="detail-inner">';
        html += '<table><thead><tr><th>Campanha</th><th>Mês</th><th class="num">Valor</th><th>Status</th></tr></thead><tbody>';
        e.campanhas.sort((a,b)=> (a.mes||"").localeCompare(b.mes||"") || a.campanha.localeCompare(b.campanha))
          .forEach(c => {
            html += '<tr><td>'+c.campanha+'</td><td>'+c.mes+'</td><td class="num">'+fmtMoney(c.premiacao)+'</td><td><span class="pill '+(c.status==="Pago"?"pago":"pend")+'">'+c.status+'</span></td></tr>';
          });
        html += '</tbody></table></div></td></tr>';
      }
    });
    html += '</tbody></table>';
  }
  html += '</div>';

  if(state.confirmClear){
    html += '<div class="modal-back" id="modalBack"><div class="modal">';
    html += '<h3>Limpar todos os dados?</h3>';
    html += '<p>Isso vai apagar permanentemente todos os registros importados. Essa ação não pode ser desfeita.</p>';
    html += '<div class="row"><button class="btn" id="cancelClear">Cancelar</button><button class="btn danger" id="confirmClearBtn">Apagar tudo</button></div>';
    html += '</div></div>';
  }

  root.innerHTML = html;
  attachEvents();
}

function attachEvents(){
  const dz = document.getElementById("dropzone");
  const fileInput = document.getElementById("fileInput");
  if(dz){
    dz.addEventListener("click", () => fileInput.click());
    dz.addEventListener("dragover", (e) => { e.preventDefault(); dz.classList.add("drag"); });
    dz.addEventListener("dragleave", () => dz.classList.remove("drag"));
    dz.addEventListener("drop", (e) => {
      e.preventDefault();
      dz.classList.remove("drag");
      if(e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });
  }
  if(fileInput){
    fileInput.addEventListener("change", (e) => {
      if(e.target.files.length) handleFile(e.target.files[0]);
    });
  }
  const closeReceipt = document.getElementById("closeReceipt");
  if(closeReceipt){
    closeReceipt.addEventListener("click", () => { state.lastReceipt = null; render(); });
  }
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => { state.gsheetTab = btn.getAttribute("data-tab"); render(); });
  });
  const gsheetLinkInput = document.getElementById("gsheetLinkInput");
  if(gsheetLinkInput){
    gsheetLinkInput.addEventListener("input", (e) => { state.gsheetLink = e.target.value; });
  }
  const gsheetFetchBtn = document.getElementById("gsheetFetchBtn");
  if(gsheetFetchBtn){
    gsheetFetchBtn.addEventListener("click", () => fetchGoogleSheet(state.gsheetLink));
  }
  const pasteArea = document.getElementById("pasteArea");
  if(pasteArea){
    pasteArea.addEventListener("input", (e) => { state.pasteText = e.target.value; });
  }
  const pasteProcessBtn = document.getElementById("pasteProcessBtn");
  if(pasteProcessBtn){
    pasteProcessBtn.addEventListener("click", processPastedData);
  }
  const toggleLogBtn = document.getElementById("toggleLogBtn");
  if(toggleLogBtn){
    toggleLogBtn.addEventListener("click", () => { state.showLog = !state.showLog; render(); });
  }
  const searchInput = document.getElementById("searchInput");
  if(searchInput){
    searchInput.addEventListener("input", (e) => { state.search = e.target.value; render(); });
    searchInput.focus();
    searchInput.setSelectionRange(searchInput.value.length, searchInput.value.length);
  }
  const statusSelect = document.getElementById("statusSelect");
  if(statusSelect){
    statusSelect.addEventListener("change", (e) => { state.statusFilter = e.target.value; render(); });
  }
  const mesSelect = document.getElementById("mesSelect");
  if(mesSelect){
    mesSelect.addEventListener("change", (e) => { state.mesFilter = e.target.value; render(); });
  }
  const exportBtn = document.getElementById("exportBtn");
  if(exportBtn){
    exportBtn.addEventListener("click", exportXLSX);
  }
  const clearBtn = document.getElementById("clearBtn");
  if(clearBtn){
    clearBtn.addEventListener("click", () => { state.confirmClear = true; render(); });
  }
  const cancelClear = document.getElementById("cancelClear");
  if(cancelClear){
    cancelClear.addEventListener("click", () => { state.confirmClear = false; render(); });
  }
  const confirmClearBtn = document.getElementById("confirmClearBtn");
  if(confirmClearBtn){
    confirmClearBtn.addEventListener("click", clearAll);
  }
  document.querySelectorAll(".emp-row").forEach(row => {
    row.addEventListener("click", () => {
      const cpf = row.getAttribute("data-cpf");
      state.expanded = state.expanded === cpf ? null : cpf;
      render();
    });
  });
}
